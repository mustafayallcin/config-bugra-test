eureka.client.service-url.defaultZone:
  configValueCount: "SINGLE"
  configValueType: "STRING"
  displayName: "Eureka Default Zone URL"
  description: "Eureka server URL including basic auth credentials for service registration"
  sectionName: "EUREKA_DEFAULT_ZONE"
  encrypted: true
  rule: null
  restartRequired: true
  defaultValue: "http://USERNAME:PASSWORD@localhost:8761/eureka/"
jhipster.security.oauth2.audience:
  configValueCount: "LIST"
  configValueType: "STRING"
  displayName: "Audiences"
  description: "Comma-separated list of trusted audience values for JWT validation"
  sectionName: "AUDIENCES"
  encrypted: false
  rule: null
  restartRequired: false
  defaultValue:
  - "account"
  - "api://default"
  - "sistas-chatbot"
  - "sistas-eva"
  - "sistas-voice"
kafka.agentMessageTopic:
  configValueCount: "SINGLE"
